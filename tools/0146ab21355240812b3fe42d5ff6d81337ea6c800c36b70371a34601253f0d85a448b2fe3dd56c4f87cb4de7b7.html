<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <!-- Мета-тег для правильной работы на мобильных устройствах -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Калькулятор процентов</title>
    <!-- Кастомная фавиконка с иконкой % -->
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='20' fill='%231a1a1a'/><text x='50%' y='52%' dominant-baseline='central' text-anchor='middle' font-size='90' font-family='sans-serif' font-weight='bold' fill='%2300bcd4'>%25</text></svg>">
    <style>
        body { 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            background-color: #1a1a1a; 
            color: #e0e0e0; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            padding: 20px 10px; 
            margin: 0;
            box-sizing: border-box;
        }
        .container { 
            width: 100%; 
            max-width: 650px; 
            background: #2d2d2d; 
            padding: 25px; 
            border-radius: 12px; 
            box-shadow: 0 10px 30px rgba(0,0,0,0.5); 
            box-sizing: border-box;
        }
        h2 { 
            color: #00bcd4; 
            text-align: center; 
            margin-top: 0;
            margin-bottom: 25px;
        }
        .calc-card {
            background: #333;
            padding: 18px;
            border-radius: 8px;
            margin-bottom: 15px;
            border: 1px solid #444;
        }
        .calc-card-title {
            font-size: 14px;
            font-weight: bold;
            color: #aaa;
            margin-bottom: 12px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        .calc-row {
            display: flex;
            align-items: center;
            gap: 10px;
            flex-wrap: wrap; /* Разрешаем перенос элементов */
        }
        input[type="number"], select {
            background: #222;
            color: #fff;
            border: 1px solid #555;
            padding: 10px;
            border-radius: 6px;
            font-size: 16px;
            width: 100px;
            outline: none;
            box-sizing: border-box;
            flex-grow: 1; /* Позволяет полям гибко сжиматься/растягиваться */
            min-width: 70px;
        }
        input[type="number"]:focus, select:focus {
            border-color: #00bcd4;
        }
        .result-val {
            font-size: 18px;
            font-weight: bold;
            color: #00e5ff;
            background: #222;
            padding: 8px 12px;
            border-radius: 6px;
            border: 1px solid #111;
            min-width: 80px;
            text-align: center;
            display: inline-block;
            font-family: 'Courier New', monospace;
            box-sizing: border-box;
        }
        .sub-text {
            color: #888;
            font-size: 13px;
            margin-top: 6px;
        }
        button.reset-btn {
            width: 100%;
            padding: 12px;
            cursor: pointer;
            border: none;
            border-radius: 6px;
            font-weight: bold;
            background: #555;
            color: white;
            transition: 0.2s;
            margin-top: 10px;
            font-size: 14px;
        }
        button.reset-btn:hover {
            background: #666;
        }

        /* --- АДАПТИВНЫЕ ПРАВКИ ДЛЯ МОБИЛЬНЫХ ЭКРАНОВ --- */
        @media (max-width: 480px) {
            body {
                padding: 10px 5px;
            }
            .container {
                padding: 15px;
                border-radius: 8px;
            }
            h2 {
                font-size: 20px;
                margin-bottom: 15px;
            }
            .calc-card {
                padding: 12px;
            }
            .calc-row {
                gap: 8px;
            }
            /* Разделители и знаки "=" переносим на новую строку вместе с результатом */
            .calc-row span {
                font-size: 14px;
            }
            .result-val {
                width: 100%; /* Результат занимает всю ширину на узких экранах */
                font-size: 16px;
                margin-top: 4px;
            }
        }
    </style>
</head>
<body>

<div class="container">
    <h2>Калькулятор процентов</h2>

    <!-- 1. Сколько будет X% от числа Y -->
    <div class="calc-card">
        <div class="calc-card-title">1. Процент от числа</div>
        <div class="calc-row">
            <span>Сколько будет</span>
            <input type="number" id="c1_p" value="15" oninput="calc1()">
            <span>% от числа</span>
            <input type="number" id="c1_v" value="1000" oninput="calc1()">
            <span>=</span>
            <span id="c1_res" class="result-val">150</span>
        </div>
    </div>

    <!-- 2. Расчет скидки (Цена со скидкой и Экономия) -->
    <div class="calc-card">
        <div class="calc-card-title">2. Расчет скидки</div>
        <div class="calc-row">
            <span>Цена:</span>
            <input type="number" id="c2_v" value="5000" oninput="calc2()">
            <span>Скидка:</span>
            <input type="number" id="c2_p" value="20" oninput="calc2()">
            <span>%</span>
            <span>=</span>
            <span id="c2_res" class="result-val">4000</span>
        </div>
        <div id="c2_sub" class="sub-text">Экономия: 1000</div>
    </div>

    <!-- 3. Прибавить или вычесть процент -->
    <div class="calc-card">
        <div class="calc-card-title">3. Прибавить / Вычесть процент</div>
        <div class="calc-row">
            <span>К числу</span>
            <input type="number" id="c3_v" value="100" oninput="calc3()">
            <select id="c3_op" onchange="calc3()">
                <option value="+">+</option>
                <option value="-">-</option>
            </select>
            <input type="number" id="c3_p" value="20" oninput="calc3()">
            <span>%</span>
            <span>=</span>
            <span id="c3_res" class="result-val">120</span>
        </div>
    </div>

    <!-- 4. Процентное изменение (разница в %) -->
    <div class="calc-card">
        <div class="calc-card-title">4. Изменение в процентах (Разница)</div>
        <div class="calc-row">
            <span>Было:</span>
            <input type="number" id="c4_v1" value="200" oninput="calc4()">
            <span>Стало:</span>
            <input type="number" id="c4_v2" value="250" oninput="calc4()">
            <span>=</span>
            <span id="c4_res" class="result-val">+25%</span>
        </div>
        <div id="c4_sub" class="sub-text">Абсолютная разница: +50</div>
    </div>

    <button class="reset-btn" onclick="resetAll()">Сбросить значения</button>
</div>

<script>
    // Вспомогательное форматирование чисел (убирает лишние знаки после запятой)
    function fmt(num) {
        if (isNaN(num) || !isFinite(num)) return "0";
        return Number(num.toFixed(2)).toString();
    }

    // 1. Процент от числа
    function calc1() {
        const p = parseFloat(document.getElementById('c1_p').value) || 0;
        const v = parseFloat(document.getElementById('c1_v').value) || 0;
        document.getElementById('c1_res').innerText = fmt((v * p) / 100);
    }

    // 2. Скидка
    function calc2() {
        const v = parseFloat(document.getElementById('c2_v').value) || 0;
        const p = parseFloat(document.getElementById('c2_p').value) || 0;
        const discount = (v * p) / 100;
        const finalPrice = v - discount;

        document.getElementById('c2_res').innerText = fmt(finalPrice);
        document.getElementById('c2_sub').innerText = `Экономия: ${fmt(discount)}`;
    }

    // 3. Прибавить / вычесть
    function calc3() {
        const v = parseFloat(document.getElementById('c3_v').value) || 0;
        const p = parseFloat(document.getElementById('c3_p').value) || 0;
        const op = document.getElementById('c3_op').value;
        
        const delta = (v * p) / 100;
        const res = op === '+' ? v + delta : v - delta;

        document.getElementById('c3_res').innerText = fmt(res);
    }

    // 4. Процентное изменение
    function calc4() {
        const v1 = parseFloat(document.getElementById('c4_v1').value) || 0;
        const v2 = parseFloat(document.getElementById('c4_v2').value) || 0;
        
        if (v1 === 0) {
            document.getElementById('c4_res').innerText = "0%";
            document.getElementById('c4_sub').innerText = "Абсолютная разница: 0";
            return;
        }

        const diff = v2 - v1;
        const percentChange = (diff / Math.abs(v1)) * 100;

        const sign = diff > 0 ? "+" : "";
        document.getElementById('c4_res').innerText = `${sign}${fmt(percentChange)}%`;
        document.getElementById('c4_sub').innerText = `Абсолютная разница: ${sign}${fmt(diff)}`;
    }

    // Сброс к дефолтным значениям
    function resetAll() {
        document.getElementById('c1_p').value = 15;
        document.getElementById('c1_v').value = 1000;
        document.getElementById('c2_v').value = 5000;
        document.getElementById('c2_p').value = 20;
        document.getElementById('c3_v').value = 100;
        document.getElementById('c3_op').value = "+";
        document.getElementById('c3_p').value = 20;
        document.getElementById('c4_v1').value = 200;
        document.getElementById('c4_v2').value = 250;
        
        calc1();
        calc2();
        calc3();
        calc4();
    }

    // Инициализация при старте
    calc1();
    calc2();
    calc3();
    calc4();
</script>

<div id="main-footer"></div>
<script src="footer.js"></script>

</body>
</html>
