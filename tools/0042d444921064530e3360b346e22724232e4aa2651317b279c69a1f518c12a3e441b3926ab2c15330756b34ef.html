<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HEX to Binary (11-bit)</title>
    <style>
        body { 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            background-color: #1a1a1a; 
            color: #e0e0e0; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
			padding: 15px;
        }
        .container { 
            width: 100%; 
            max-width: 800px; 
            background: #2d2d2d; 
            padding: 25px; 
            border-radius: 12px; 
            box-shadow: 0 10px 30px rgba(0,0,0,0.5); 
        }
        h2 { color: #00bcd4; text-align: center; }
        label { display: block; margin-bottom: 10px; font-weight: bold; color: #aaa; }
        textarea { 
            width: 100%; 
            height: 100px; 
            background: #3d3d3d; 
            color: #fff; 
            border: 1px solid #444; 
            border-radius: 6px; 
            padding: 10px; 
            box-sizing: border-box; 
            font-size: 16px; 
            resize: vertical;
            margin-bottom: 20px;
            font-family: monospace;
        }
        textarea:focus { border-color: #00bcd4; outline: none; }
        .options { margin-bottom: 20px; display: flex; align-items: center; gap: 15px; }
        .result-area { 
            background: #222; 
            color: #00e5ff; 
            padding: 15px; 
            border-radius: 6px; 
            min-height: 50px; 
            font-size: 16px;
            word-break: break-all; 
            font-family: 'Courier New', monospace; 
            border: 1px solid #111;
            line-height: 1.6;
        }
        button { 
            padding: 12px 25px; 
            cursor: pointer; 
            border: none; 
            border-radius: 6px; 
            font-weight: bold; 
            background: #00bcd4; 
            color: white; 
            transition: 0.2s; 
			flex: 1 1 150px;
			box-sizing: border-box;	
        }
        button:hover { background: #0097a7; }
        button.copy-btn { background: #4caf50; margin-left: 10px; }
        .info { color: #888; font-size: 0.85em; margin-top: 5px; }
		
		.mystyle {
			display: flex;
			flex-wrap: wrap;
			gap: 10px;
		}
		
		@media (max-width: 480px) {
			.container { padding: 15px; }
			.options-grid { grid-template-columns: 1fr; 
			}
		}
    </style>
</head>
<body>

<div class="container">
    <h2>HEX ➔ Binary (11-bit Chunks)</h2>

    <label>Введите HEX строку:</label>
    <textarea id="inputHex" placeholder="Пример: 7FF 001" oninput="process()"></textarea>
    <div class="info">Программа делит HEX на блоки по 3 символа и переводит в 11-битный двоичный код.</div>

    <div class="options" style="margin-top: 15px;">
        <label style="display: inline; cursor: pointer;">
            <input type="checkbox" id="useSpaces" checked onchange="process()"> Разделять пробелами
        </label>
    </div>

    <label>Результат (Binary):</label>
    <div id="outputBinary" class="result-area"></div>
    
    <div class="mystyle" style="margin-top: 20px;">
        <button onclick="process()">Конвертировать</button>
        <button class="copy-btn" onclick="copyToClipboard()">Копировать Binary</button>
        <button style="background:#555; margin-left: 10px;" onclick="location.reload()">Сброс</button>
    </div>
</div>

<script>
    function process() {
        const input = document.getElementById('inputHex').value.trim();
        const useSpaces = document.getElementById('useSpaces').checked;
        const outputDiv = document.getElementById('outputBinary');
        
        if (!input) {
            outputDiv.innerText = "";
            return;
        }

        // 1. Оставляем только символы 0-9 и A-F
        const cleanHex = input.replace(/[^0-9A-Fa-f]/g, "");
        
        // 2. Режем на блоки по 3 символа
        const chunks = cleanHex.match(/.{1,3}/g) || [];
        
        let binaryResults = chunks.map(chunk => {
            // Переводим из HEX в десятичную
            let decimal = parseInt(chunk, 16);
            
            if (isNaN(decimal)) return "";

            // Переводим в Binary и дополняем нулями до 11 бит
            let binary = decimal.toString(2).padStart(11, '0');
            
            // Если в куске было меньше 3 символов HEX (хвост), 
            // логика все равно сделает его 11-битным. 
            return binary;
        }).filter(item => item !== "");

        // 3. Вывод
        outputDiv.innerText = useSpaces ? binaryResults.join(" ") : binaryResults.join("");
    }

    function copyToClipboard() {
        const text = document.getElementById('outputBinary').innerText;
        if (!text) return;
        
        navigator.clipboard.writeText(text).then(() => {
            alert("Бинарная строка скопирована!");
        });
    }
</script>

<div id="main-footer" class="width: 100%;"></div>
<script src="footer.js"></script>

</body>
</html>
