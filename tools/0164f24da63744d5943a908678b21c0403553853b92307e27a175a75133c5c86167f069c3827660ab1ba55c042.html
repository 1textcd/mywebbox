ngth;while(i<U){if(PassCh[i]==a){sss=i+n;i=U;}i++;}return sss;}function Shif(){var o=document.getElementById("a").value;var P=document.getElementById("p").value;var n=document.getElementById("salt").value;var w=P.length;var y=0;while(y<w){if(pf(P[y])==1){alert("wrong symbols!");return;break;}y++;}a=salt(n);var s="";if(n>0){o+="\n\n"+a;s="S";}if(s!="S"&&n>0){alert("salt error!");}else if(n>0){s="slt";}o=cf(o,1);o=af(1,P,o);var i=0;var j=0;var q=1;var u=[];var a="";var r=o.split('');var l=r.length;P=P.split('');var pl=P.length;var ip=0;while(ip<pl){var ch=pf(P[ip]);while(j<l){if(r[i]!=undefined){if(r[i]==""){i++}else{if(q==ch){u[j]=r[i];r[i]="";i++;q=1;j++;}else{i++;q++;}}}else{i=0}}r=0;r=u.slice();i=0;j=0;q=1;ip++;}var t=document.getElementById("a");u=u.join("");t.value="W"+u+"W"+"W"+ver+s+"W";}function Desh(){var o=document.getElementById("a").value;var P=document.getElementById("p").value;if(o.indexOf('W')>=0){var arr = o.split('W');if(arr.length>3&&arr.length<7){}else{alert('Something wrong');return;}o=arr[1];} if(P===""){alert("The pass field is empty!");}var i=0;var j=0;var q=1;var s="";var a=o.split('');var b=o.split('');var c=[];var l=a.length;var d=0;var v=P.split('');var pl=v.length;var ip=0;v=v.reverse();var wer=0;ip=0;while(ip<pl){c=[];var ch=pf(v[ip]);while(j<l){if(a[i]!=undefined){if(a[i]==""){i++}else{if(q==ch){c[i]=b[d];a[i]="";i++;q=1;j++;d++;}else{i++;q++;}}}else{i=0;}}a=0;b=0;a=c.slice();b=c.slice();c=c.slice();d=0;j=0;ip++;q=1;i=0;}var t=document.getElementById("a");s=c.join("");s=af(2,P,s);s=cf(s,2);t.value=s;}</script></head><body><div style="width:90%;margin:0 auto;text-align:center;"><h1>TextCD <font size="4px">3.04.1</font></h1><input type="text" id="p" maxlength="110" size="30" value="" autocomplete="off"><input type="text" id="salt" title="salt" maxlength="5" size="5" value="" autocomplete="off"><p></p><textarea id="a" cols="40" rows="10"></textarea><br><p></p><button onClick="Shif()">code</button><button onClick="Desh()">decode</button><br>
