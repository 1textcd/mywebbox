<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Текстовый Миксер</title>
    <style>
		/*         body {
		font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
		display: flex;
		justify-content: center;
		align-items: center;
		height: 100vh;
		margin: 0;
		background-color: #f0f2f5;
        } */
		
		body {
font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
display: flex;
flex-direction: column;
align-items: center;
justify-content: flex-start;
min-height: 100vh;
margin: 10;
padding-top: 0px;
background-color: #f0f2f5;
box-sizing: border-box;
}
		
		
        .container {
            background: white;
            padding: 2rem;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            width: 100%;
            max-width: 500px;
        }
		
        h2 { color: #333; margin-top: 0; }
        textarea {
            width: 100%;
            height: 120px;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 8px;
            resize: none;
            box-sizing: border-box;
            font-size: 16px;
        }
        button {
            width: 100%;
            padding: 12px;
            margin-top: 15px;
            background-color: #007bff;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 16px;
            transition: background 0.3s;
        }
        button:hover { background-color: #0056b3; }
        .result-label {
            margin-top: 20px;
            font-weight: bold;
            color: #555;
            display: block;
        }
        #output {
            margin-top: 5px;
            padding: 10px;
            background: #f8f9fa;
            border: 1px solid #eee;
            border-radius: 8px;
            word-break: break-all;
            min-height: 40px;
        }

		@media (max-width: 480px) {
			.container { padding: 15px; }
			.options-grid { grid-template-columns: 1fr; 
			}
		}		
		
    </style>
</head>
<body>

<div class="container">
    <h2>🌀 Перемешиватель текста</h2>
    <textarea id="input" placeholder="Введите текст или цифры здесь..."></textarea>
    <button onclick="shuffleText()">Перемешать всё!</button>
    
    <span class="result-label">Результат:</span>
    <div id="output">Здесь появится результат...</div>
</div>

<script>
    function shuffleText() {
        const input = document.getElementById('input').value;
        if (!input) {
            alert("Сначала введите что-нибудь!");
            return;
        }

        // Превращаем строку в массив символов
        let array = input.split('');

        // Алгоритм Тасования Фишера — Йетса
        for (let i = array.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [array[i], array[j]] = [array[j], array[i]];
        }

        // Собираем обратно в строку и выводим
        document.getElementById('output').innerText = array.join('');
    }
</script>

<div id="main-footer" class="width: 100%;"></div>
<script src="footer.js"></script>

</body>
</html>
