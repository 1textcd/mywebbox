<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Генератор паролей</title>
    <!-- Кастомная фавиконка с крупной буквой P -->
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='20' fill='%231a1a1a'/><text x='50%' y='50%' dominant-baseline='central' text-anchor='middle' font-size='100' font-family='sans-serif' font-weight='bold' fill='%23e91e63'>P</text></svg>">
    <style>
        body { 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            background-color: #1a1a1a; 
            color: #e0e0e0; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            padding: 15px;
            margin: 0;
        }
        .container { 
            width: 100%; 
            max-width: 600px; 
            background: #2d2d2d; 
            padding: 25px; 
            border-radius: 12px; 
            box-shadow: 0 10px 30px rgba(0,0,0,0.5); 
            box-sizing: border-box;
			
        }
        h2 { 
            color: #e91e63; 
            text-align: center; 
            margin-top: 0;
            margin-bottom: 20px;
        }
        .result-box {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }
        input[type="text"] { 
            flex: 1;
            background: #222; 
            color: #e91e63; 
            border: 1px solid #444; 
            border-radius: 6px; 
            padding: 12px; 
            font-size: 18px; 
            font-family: 'Courier New', monospace;
            font-weight: bold;
            letter-spacing: 1px;
        }
        .length-control {
            display: flex;
            align-items: center;
            gap: 15px;
            margin-bottom: 20px;
            background: #333;
            padding: 15px;
            border-radius: 6px;
        }
        .length-control input[type="range"] {
            flex: 1;
            accent-color: #e91e63;
            cursor: pointer;
        }
        .length-control input[type="number"] {
            width: 60px;
            background: #222;
            color: #fff;
            border: 1px solid #555;
            padding: 5px;
            border-radius: 4px;
            text-align: center;
            font-size: 16px;
        }
        .options-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin-bottom: 25px;
        }
        .checkbox-label {
            display: flex;
            align-items: center;
            gap: 10px;
            background: #333;
            padding: 12px;
            border-radius: 6px;
            cursor: pointer;
            user-select: none;
            transition: 0.2s;
        }
        .checkbox-label:hover {
            background: #3d3d3d;
        }
        .checkbox-label input[type="checkbox"] {
            width: 18px;
            height: 18px;
            accent-color: #e91e63;
            cursor: pointer;
        }
        .btn-group {
            display: flex;
            gap: 10px;
        }
        button { 
            flex: 1;
            padding: 12px 15px; 
            cursor: pointer; 
            border: none; 
            border-radius: 6px; 
            font-weight: bold; 
            background: #e91e63; 
            color: white; 
            transition: 0.2s; 
            font-size: 15px;
        }
        button:hover { 
            background: #d81b60; 
        }
        button.copy-btn {
            background: #2196f3;
        }
        button.copy-btn:hover {
            background: #1e88e5;
        }
        .error {
            color: #f44336;
            font-size: 14px;
            margin-top: 10px;
            text-align: center;
            display: none;
        }
		
		@media (max-width: 480px) {
			.container { padding: 15px; }
			.options-grid { grid-template-columns: 1fr; 
			}
}
    </style>
</head>
<body>

<div class="container">
    <h2>Генератор паролей</h2>

    <!-- Поле вывода результата -->
    <div class="result-box">
        <input type="text" id="passwordOutput" readonly placeholder="Нажмите «Сгенерировать»">
    </div>

    <!-- Регулировка длины -->
    <div class="length-control">
        <label for="lengthRange">Длина:</label>
        <input type="range" id="lengthRange" min="4" max="64" value="12" oninput="syncLength(this.value)">
        <input type="number" id="lengthNumber" min="4" max="64" value="12" oninput="syncLength(this.value)">
    </div>

    <!-- Настройки символов -->
    <div class="options-grid">
        <label class="checkbox-label">
            <input type="checkbox" id="chkDigits" checked onchange="generate()"> Цифры (0-9)
        </label>
		<label class="checkbox-label">
            <input type="checkbox" id="chkLower" checked onchange="generate()"> Строчные буквы (a-z)
        </label>
		<label class="checkbox-label">
            <input type="checkbox" id="chkUpper"onchange="generate()"> Прописные буквы (A-Z)
        </label>
        <label class="checkbox-label">
            <input type="checkbox" id="chkSymbols" onchange="generate()"> Спец. символы (!@#$%...)
        </label>

        
    </div>

    <div id="errorMsg" class="error">Выберите хотя бы один набор символов!</div>

    <!-- Кнопки действий -->
    <div class="btn-group">
        <button onclick="generate()">Сгенерировать</button>
        <button class="copy-btn" onclick="copyPassword()">Копировать</button>
    </div>
</div>

<script>
    const charsData = {
        digits: '0123456789',
        symbols: '!@#$%^&*()_+-=[]{}|;:,.<>?',
        upper: 'ABCDEFGHIJKLMNOPQRSTUVWXYZ',
        lower: 'abcdefghijklmnopqrstuvwxyz'
    };

    // Синхронизация ползунка и числового поля
    function syncLength(val) {
        let num = parseInt(val) || 12;
        if (num < 4) num = 4;
        if (num > 64) num = 64;
        
        document.getElementById('lengthRange').value = num;
        document.getElementById('lengthNumber').value = num;
        generate();
    }

    // Криптографически стойкая генерация
    function generate() {
        const length = parseInt(document.getElementById('lengthNumber').value);
        const useDigits = document.getElementById('chkDigits').checked;
        const useSymbols = document.getElementById('chkSymbols').checked;
        const useUpper = document.getElementById('chkUpper').checked;
        const useLower = document.getElementById('chkLower').checked;
        const errorMsg = document.getElementById('errorMsg');
        const output = document.getElementById('passwordOutput');

        let pool = '';
        if (useDigits) pool += charsData.digits;
        if (useSymbols) pool += charsData.symbols;
        if (useUpper) pool += charsData.upper;
        if (useLower) pool += charsData.lower;

        if (!pool) {
            errorMsg.style.display = 'block';
            output.value = '';
            return;
        }
        errorMsg.style.display = 'none';

        // Использование встроенного безопасно-рандомного генератора браузера (crypto)
        const randomValues = new Uint32Array(length);
        window.crypto.getRandomValues(randomValues);

        let password = '';
        for (let i = 0; i < length; i++) {
            password += pool[randomValues[i] % pool.length];
        }

        output.value = password;
    }

    // Копирование в буфер
    function copyPassword() {
        const output = document.getElementById('passwordOutput');
        if (!output.value) return;

        navigator.clipboard.writeText(output.value).then(() => {
            const btn = document.querySelector('.copy-btn');
            const originalText = btn.innerText;
            btn.innerText = 'Скопировано!';
            setTimeout(() => btn.innerText = originalText, 1500);
        });
    }

    // Автогенерация при загрузке
    generate();
</script>

	<div id="main-footer"></div>
	<script src="footer.js"></script>
	
</body>
</html>
