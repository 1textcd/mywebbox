<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Binary to HEX (11-bit)</title>
    <style>
        body { 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            background-color: #1a1a1a; 
            color: #e0e0e0; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            padding: 40px; 
        }
        .container { 
            width: 100%; 
            max-width: 800px; 
            background: #2d2d2d; 
            padding: 25px; 
            border-radius: 12px; 
            box-shadow: 0 10px 30px rgba(0,0,0,0.5); 
        }
        h2 { color: #ff9800; text-align: center; }
        label { display: block; margin-bottom: 10px; font-weight: bold; color: #aaa; }
        textarea { 
            width: 100%; 
            height: 100px; 
            background: #3d3d3d; 
            color: #fff; 
            border: 1px solid #444; 
            border-radius: 6px; 
            padding: 10px; 
            box-sizing: border-box; 
            font-size: 16px; 
            resize: vertical;
            margin-bottom: 20px;
            font-family: monospace;
        }
        textarea:focus { border-color: #ff9800; outline: none; }
        .options { margin-bottom: 20px; display: flex; align-items: center; gap: 15px; }
        .result-area { 
            background: #222; 
            color: #ffcc00; 
            padding: 15px; 
            border-radius: 6px; 
            min-height: 50px; 
            font-size: 18px;
            word-break: break-all; 
            font-family: 'Courier New', monospace; 
            border: 1px solid #111;
            line-height: 1.6;
        }
        button { 
            padding: 12px 25px; 
            cursor: pointer; 
            border: none; 
            border-radius: 6px; 
            font-weight: bold; 
            background: #ff9800; 
            color: white; 
            transition: 0.2s; 
        }
        button:hover { background: #e68a00; }
        button.copy-btn { background: #2196f3; margin-left: 10px; }
        .info { color: #888; font-size: 0.85em; margin-top: 5px; }
    </style>
</head>
<body>

<div class="container">
    <h2>Binary ➔ HEX (11-bit Chunks)</h2>

    <label>Введите бинарную строку:</label>
    <textarea id="inputBinary" placeholder="Пример: 1111111111100000000001" oninput="process()"></textarea>
    <div class="info">Программа делит строку на блоки по 11 бит и переводит каждый блок в HEX (3 символа).</div>

    <div class="options" style="margin-top: 15px;">
        <label style="display: inline; cursor: pointer;">
            <input type="checkbox" id="useSpaces" checked onchange="process()"> Разделять пробелами
        </label>
    </div>

    <label>Результат (HEX):</label>
    <div id="outputHex" class="result-area"></div>
    
    <div style="margin-top: 20px;">
        <button onclick="process()">Конвертировать</button>
        <button class="copy-btn" onclick="copyToClipboard()">Копировать HEX</button>
        <button style="background:#555; margin-left: 10px;" onclick="location.reload()">Сброс</button>
    </div>
</div>

<script>
    function process() {
        const input = document.getElementById('inputBinary').value.trim();
        const useSpaces = document.getElementById('useSpaces').checked;
        const outputDiv = document.getElementById('outputHex');
        
        if (!input) {
            outputDiv.innerText = "";
            return;
        }

        // 1. Оставляем только 0 и 1
        const cleanBinary = input.replace(/[^01]/g, "");
        
        // 2. Режем на блоки по 11 бит
        const chunks = cleanBinary.match(/.{1,11}/g) || [];
        
        let hexResults = chunks.map(chunk => {
            if (chunk.length === 11) {
                // Переводим из двоичной в десятичную, затем в HEX
                let decimal = parseInt(chunk, 2);
                let hex = decimal.toString(16).toUpperCase();
                
                // Дополняем нулями слева до 3 символов (Padding)
                return hex.padStart(3, '0');
            } else {
                // Если в хвосте меньше 11 бит, просто переводим как есть (опционально)
                return ""; 
            }
        }).filter(item => item !== ""); // Убираем пустые остатки

        // 3. Вывод с пробелами или без
        outputDiv.innerText = useSpaces ? hexResults.join(" ") : hexResults.join("");
    }

    function copyToClipboard() {
        const text = document.getElementById('outputHex').innerText;
        if (!text) return;
        
        navigator.clipboard.writeText(text).then(() => {
            alert("HEX-строка скопирована!");
        });
    }

	</script>

</body>
</html>
