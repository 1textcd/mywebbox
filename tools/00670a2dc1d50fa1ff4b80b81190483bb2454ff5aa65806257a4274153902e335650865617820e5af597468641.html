<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
 <meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Двоичное в десятичное</title>

  <style>
    body {
	font-family:Inter,Segoe UI,Roboto,Arial,sans-serif;margin:24px;background:#f7f8fb;color:#0b1220
		max-width:800px;
		margin:28px auto;

		padding:0;
		// padding:20px;
		color:#111;
		background:#f7f8fb;
	}

        .container { 
            width: 100%; 
            max-width: 800px; 
            background: transparent; 
            padding: 25px; 
            border-radius: 12px; 
            //box-shadow: 0 10px 30px rgba(0,0,0,0.5); 
            box-sizing: border-box;
			margin: 0 auto;
        }


		@media (max-width: 480px) {
			.container { padding: 15px; }
			.options-grid { grid-template-columns: 1fr; 
			}
		}
		
  </style>
</head>
<body>

<div class="container" id="">
<h2>Преобразователь двоичного числа в десятичное</h2>

<label for="binary">Введите двоичное число:</label>
<input type="text" id="binary" placeholder="1011">
<button onclick="convert()">Преобразовать</button>

<p>Результат: <span id="result"></span></p>

</div>

<script>
function convert() {
    const bin = document.getElementById('binary').value.trim();
    // Проверка на корректность ввода
    if (!/^[01]+$/.test(bin)) {
        alert("Пожалуйста, введите только 0 и 1.");
        return;
    }
    let decimal = 0;
    for (let i = 0; i < bin.length; i++) {
        decimal = decimal * 2 + Number(bin[i]);
    }
    document.getElementById('result').textContent = decimal;
}
</script>

<div id="main-footer" class="width: 100%;"></div>
<script src="footer.js"></script>

</body>
</html>
